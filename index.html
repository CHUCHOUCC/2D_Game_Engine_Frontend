<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Game Editor</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <main>
      <h1>2D Game Editor</h1>

      <section id="auth-panel" hidden>
        <h2>Log in or create an account</h2>
        <form id="auth-form">
          <input id="auth-username" type="text" placeholder="Username (only to register)" autocomplete="username" maxlength="50" />
          <input id="auth-email" type="email" placeholder="Email" autocomplete="email" required />
          <input id="auth-password" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" required />
          <div class="auth-buttons">
            <button id="auth-login" type="submit" class="primary">Log in</button>
            <button id="auth-register" type="button">Register</button>
          </div>
        </form>
        <p id="auth-message"></p>
      </section>

      <div id="user-bar" class="toolbar" hidden>
        <span>Logged in as <strong id="user-name"></strong></span>
        <span class="spacer"></span>
        <button id="logout">Log out</button>
      </div>

      <div id="editor" hidden>
        <div class="toolbar">
          <button id="new-project" class="primary">New project</button>
          <button id="save">Save</button>
          <button id="load">Load</button>
          <button id="play">Play</button>
          <button id="edit" hidden>Edit</button>
          <span id="project"></span>
        </div>

        <div class="toolbar edit-only">
          <button id="add-box">+ Box</button>
          <button id="add-coin">+ Coin</button>
          <button id="add-enemy">+ Enemy</button>
          <button id="delete">Delete</button>
          <button id="undo">Undo</button>
          <button id="redo">Redo</button>
        </div>

        <div id="game"></div>

        <section id="project-list">
          <h2>My projects</h2>
          <ul id="projects"></ul>
        </section>

        <div class="toolbar edit-only" style="margin-top: 8px">
          <input id="prompt" type="text" placeholder="Ask the AI, e.g. put a coin at 120 340" maxlength="500" />
          <button id="ask-ai" class="primary">Ask AI</button>
        </div>
      </div>

      <p id="status"></p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
