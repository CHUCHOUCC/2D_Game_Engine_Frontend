# Publishes the game on GitHub Pages: https://chuchoucc.github.io/2D_Game_Engine_Frontend/
#
# Run it from the Actions tab ("Deploy to GitHub Pages" > "Run workflow") after turning
# Pages on in Settings > Pages > Source: "GitHub Actions". The backend must list
# https://chuchoucc.github.io in its FRONTEND_ORIGINS variable, or the browser blocks its answers.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the Pages address
        run: npx tsc && npx vite build --base "/${{ github.event.repository.name }}/"
        env:
          VITE_API_URL: https://twod-game-engine.onrender.com
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
